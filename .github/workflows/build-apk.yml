name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Official Android Platform Files
        run: |
          # Backup custom files
          mkdir -p /tmp/backup_app
          cp -r android/app/build.gradle.kts android/app/src /tmp/backup_app/

          # Generate official Flutter android scaffolding
          rm -rf android
          flutter create . --platforms=android --org=com.karaokehub.next

          # Restore custom build.gradle.kts and src (MainActivity + JNI libs)
          cp /tmp/backup_app/build.gradle.kts android/app/build.gradle.kts
          cp -r /tmp/backup_app/src/* android/app/src/

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: karaokehub-next-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
