name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Official Android Platform
        run: |
          flutter config --no-analytics
          flutter create . --platforms=android --org=com.karaokehub --project-name=karaokehub_next

      - name: Configure Android Package ID and Native Bridge
        run: |
          # 1. Update Application ID and Namespace
          if [ -f android/app/build.gradle ]; then
            sed -i 's/applicationId ".*"/applicationId "com.karaokehub.next"/' android/app/build.gradle
            sed -i 's/namespace ".*"/namespace "com.karaokehub.next"/' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = ".*"/applicationId = "com.karaokehub.next"/' android/app/build.gradle.kts
            sed -i 's/namespace = .*/namespace = com.karaokehub.next/' android/app/build.gradle.kts
            # Fix plugin compileSdk
            echo 'subprojects { afterEvaluate { project -> if (project.hasProperty(android)) { project.android { compileSdkVersion = 36 } } } }' >> android/build.gradle
          fi

          # 2. Overwrite the auto-generated MainActivity in its exact generated location
          TARGET_FILE=$(find android/app/src/main/kotlin -name "MainActivity.kt" | head -n 1)
          if [ -n "$TARGET_FILE" ]; then
            cp templates/MainActivity.kt "$TARGET_FILE"
          else
            mkdir -p android/app/src/main/kotlin/com/karaokehub/karaokehub_next
            cp templates/MainActivity.kt android/app/src/main/kotlin/com/karaokehub/karaokehub_next/MainActivity.kt
          fi

          # 3. Copy native JNI libraries
          mkdir -p android/app/src/main/jniLibs
          if [ -d native_libs ]; then
            cp -r native_libs/* android/app/src/main/jniLibs/
          fi

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: karaokehub-next-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
