name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Official Android Platform
        run: |
          flutter config --no-analytics
          flutter create . --platforms=android --org=com.karaokehub --project-name=karaokehub_next

      - name: Configure Android Package ID and Native Bridge
        run: |
          set -e
          # 1. Update Application ID and Namespace with proper package ID com.karaokehub.next
          if [ -f android/app/build.gradle ]; then
            sed -i 's/applicationId .*/applicationId "com.karaokehub.next"/' android/app/build.gradle
            sed -i 's/namespace .*/namespace "com.karaokehub.next"/' android/app/build.gradle
            sed -i 's/minifyEnabled true/minifyEnabled false/' android/app/build.gradle || true
            sed -i 's/shrinkResources true/shrinkResources false/' android/app/build.gradle || true
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = .*/applicationId = "com.karaokehub.next"/' android/app/build.gradle.kts
            sed -i 's/namespace = .*/namespace = "com.karaokehub.next"/' android/app/build.gradle.kts
            sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/' android/app/build.gradle.kts || true
            sed -i 's/isShrinkResources = true/isShrinkResources = false/' android/app/build.gradle.kts || true
          fi

          # 2. Place MainActivity.kt and SoundFontSynth.kt in the exact directory matching package com.karaokehub.next
          rm -rf android/app/src/main/kotlin/com/karaokehub/karaokehub_next
          mkdir -p android/app/src/main/kotlin/com/karaokehub/next
          cp templates/MainActivity.kt android/app/src/main/kotlin/com/karaokehub/next/MainActivity.kt
          cp templates/SoundFontSynth.kt android/app/src/main/kotlin/com/karaokehub/next/SoundFontSynth.kt

          # 3. Copy Native C++ SoundFont synthesizer source and configure CMake
          mkdir -p android/app/src/main/cpp
          cp templates/cpp/* android/app/src/main/cpp/

          # Inject externalNativeBuild into android block of build.gradle / build.gradle.kts
          if [ -f android/app/build.gradle ]; then
            python3 -c '
with open("android/app/build.gradle", "r") as f:
    content = f.read()
if "externalNativeBuild" not in content:
    idx = content.find("android {")
    if idx != -1:
        insert = "\n    externalNativeBuild {\n        cmake {\n            path \"src/main/cpp/CMakeLists.txt\"\n        }\n    }\n"
        content = content[:idx+9] + insert + content[idx+9:]
        with open("android/app/build.gradle", "w") as f:
            f.write(content)
'
          fi
          if [ -f android/app/build.gradle.kts ]; then
            python3 -c '
with open("android/app/build.gradle.kts", "r") as f:
    content = f.read()
if "externalNativeBuild" not in content:
    idx = content.find("android {")
    if idx != -1:
        insert = "\n    externalNativeBuild {\n        cmake {\n            path = file(\"src/main/cpp/CMakeLists.txt\")\n        }\n    }\n"
        content = content[:idx+9] + insert + content[idx+9:]
        with open("android/app/build.gradle.kts", "w") as f:
            f.write(content)
'
          fi

          # 4. Add storage and network permissions to AndroidManifest.xml
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>' "$MANIFEST_FILE"
            sed -i 's/<application/<application android:requestLegacyExternalStorage="true"/' "$MANIFEST_FILE"
          fi

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: karaokehub-next-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
