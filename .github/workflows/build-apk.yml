name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Official Android Platform
        run: |
          flutter config --no-analytics
          flutter create . --platforms=android --org=com.karaokehub --project-name=karaokehub_next

      - name: Configure Android Package ID and Native Bridge
        run: |
          set -e
          # 1. Update Application ID and Namespace with proper package ID com.karaokehub.next
          if [ -f android/app/build.gradle ]; then
            sed -i 's/applicationId .*/applicationId "com.karaokehub.next"/' android/app/build.gradle
            sed -i 's/namespace .*/namespace "com.karaokehub.next"/' android/app/build.gradle
            sed -i 's/minifyEnabled true/minifyEnabled false/' android/app/build.gradle || true
            sed -i 's/shrinkResources true/shrinkResources false/' android/app/build.gradle || true
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = .*/applicationId = "com.karaokehub.next"/' android/app/build.gradle.kts
            sed -i 's/namespace = .*/namespace = "com.karaokehub.next"/' android/app/build.gradle.kts
            sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/' android/app/build.gradle.kts || true
            sed -i 's/isShrinkResources = true/isShrinkResources = false/' android/app/build.gradle.kts || true
          fi

          # Use pre-installed NDK to avoid downloading 1GB NDK 28 during build
          NDK_BASE="${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk"
          if [ -d "$NDK_BASE" ]; then
            LOCAL_NDK=$(ls "$NDK_BASE" | sort -V | tail -n 1)
            if [ -n "$LOCAL_NDK" ]; then
              echo "Using installed Android NDK: $LOCAL_NDK"
              sed -i "s/ndkVersion = .*/ndkVersion = \"$LOCAL_NDK\"/" android/app/build.gradle.kts 2>/dev/null || true
              sed -i "s/ndkVersion .*/ndkVersion \"$LOCAL_NDK\"/" android/app/build.gradle 2>/dev/null || true
            fi
          fi

          # 2. Place MainActivity.kt and BassAudioEngine.kt in directory matching package com.karaokehub.next
          rm -rf android/app/src/main/kotlin/com/karaokehub/karaokehub_next
          mkdir -p android/app/src/main/kotlin/com/karaokehub/next
          cp templates/MainActivity.kt android/app/src/main/kotlin/com/karaokehub/next/MainActivity.kt
          cp templates/BassAudioEngine.kt android/app/src/main/kotlin/com/karaokehub/next/BassAudioEngine.kt

          # 2b. Place NativeLib.kt in package com.songhub.android.database for libMewtwo.so binding
          mkdir -p android/app/src/main/kotlin/com/songhub/android/database
          cp templates/kotlin/com/songhub/android/database/NativeLib.kt android/app/src/main/kotlin/com/songhub/android/database/NativeLib.kt

          # 3. Place BASS Java wrapper classes in com/un4seen/bass
          mkdir -p android/app/src/main/java/com/un4seen/bass
          cp templates/java/com/un4seen/bass/* android/app/src/main/java/com/un4seen/bass/

          # 4. Copy BASS native shared libraries (.so) into jniLibs
          mkdir -p android/app/src/main/jniLibs
          cp -r native_libs/* android/app/src/main/jniLibs/
          python3 templates/patch_gradle.py

          # 5. Add storage and network permissions to AndroidManifest.xml
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>' "$MANIFEST_FILE"
            sed -i 's/<application/<application android:requestLegacyExternalStorage="true"/' "$MANIFEST_FILE"
          fi

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: karaokehub-next-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
